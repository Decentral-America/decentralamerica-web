  <title>DecentralAmerica</title>
  <!--
    DecentralAmerica mark. Solid #000000, no opacity and no transparency anywhere.

    One path with six subpaths, all wound the same direction, filled nonzero: the
    three arms overlap at the hub and union cleanly instead of showing a darker
    patch. That matters if the mark is ever placed at reduced opacity, where
    separate overlapping shapes compound their alpha and the seam appears.
